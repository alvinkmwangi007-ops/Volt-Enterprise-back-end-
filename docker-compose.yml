services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${DB_NAME:-volt_motors}
      MYSQL_USER: ${DB_USER:-volt}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in .env}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-volt_motors}
      DB_USER: ${DB_USER:-volt}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://vaultmotors.co.ke,https://www.vaultmotors.co.ke}
      INSPECTION_PARTNER_API_KEY: ${INSPECTION_PARTNER_API_KEY:?set in .env}
      PRIVATE_UPLOAD_FOLDER: /data/private-uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/private-uploads
    networks:
      - internal

  web:
    build: ../volt-frontend/volt-enterprise
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - internal

volumes:
  db_data:
  uploads:

networks:
  internal:
